<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Arduino krok po kroku</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/blockly@11.2.2/blockly_compressed.js"></script>
<script src="https://cdn.jsdelivr.net/npm/blockly@11.2.2/blocks_compressed.js"></script>
<script src="https://cdn.jsdelivr.net/npm/blockly@11.2.2/msg/pl.js"></script>
<style>
:root{
  --bg:#E9EEF0; --surface:#FFFFFF; --surface-2:#F3F6F7; --ink:#16252C; --muted:#5A6C74; --line:#CFD9DD;
  --primary:#E8792F; --primary-ink:#FFFFFF; --stop:#C7362F; --sel:#FFF1E6; --sel-line:#E8792F;
  --radius:12px; color-scheme: light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#0F181C; --surface:#172429; --surface-2:#1D2D33; --ink:#E4EDF0; --muted:#98ABB3; --line:#2C3F47;
    --primary:#F08A45; --primary-ink:#1A0D04; --stop:#E2554D; --sel:#3A2618; --sel-line:#F08A45; color-scheme: dark; }
}
:root[data-theme="dark"]{ --bg:#0F181C; --surface:#172429; --surface-2:#1D2D33; --ink:#E4EDF0; --muted:#98ABB3; --line:#2C3F47;
  --primary:#F08A45; --primary-ink:#1A0D04; --stop:#E2554D; --sel:#3A2618; --sel-line:#F08A45; color-scheme: dark; }
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:"Lexend",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:15px;line-height:1.5}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--primary);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto 1fr auto;grid-template-columns:minmax(0,1fr)}
header.top{display:flex;align-items:center;gap:12px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand svg{width:30px;height:30px;flex:none}
.brand h1{font-size:17px;font-weight:700;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;cursor:pointer;font-weight:500;line-height:1.2;font-size:14px}
.btn-run{background:var(--primary);color:var(--primary-ink);border-color:transparent;padding:9px 18px;font-weight:600;display:inline-flex;align-items:center;gap:8px;white-space:nowrap;font-size:15px}
.btn-run.running{background:var(--stop);color:#fff}
.btn-run svg{width:14px;height:14px}
main{min-height:0;display:grid;grid-template-columns:240px minmax(0,1.15fr) minmax(0,1fr)}
#lessonPanel{order:1} #wiringPanel{order:2} #programPanel{order:3}
.panel{min-height:0;display:flex;flex-direction:column;background:var(--surface)}
.panel + .panel{border-left:1px solid var(--line)}
.scroll{overflow:auto;min-height:0;flex:1}
.panel-head{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--line);min-height:50px}
.panel-head h2{font-size:15px;margin:0;font-weight:600}
.lessons{list-style:none;margin:0;padding:8px}
.lessons button{width:100%;display:flex;align-items:center;gap:10px;text-align:left;border:1px solid transparent;background:none;border-radius:10px;padding:9px 10px;cursor:pointer;font-weight:500;line-height:1.3}
.lessons button:hover{background:var(--surface-2)}
.lessons button[aria-current="true"]{background:var(--sel);border-color:var(--sel-line)}
.lessons .no{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);border:1px solid var(--line);font-size:13px;font-weight:700;flex:none}
.lessons button[aria-current="true"] .no{background:var(--primary);color:var(--primary-ink);border-color:transparent}
.goal{padding:12px 16px;border-bottom:1px solid var(--line);font-size:14.5px}
.goal b{display:block;font-size:20px;margin-bottom:2px;line-height:1.25}
#blocklyDiv{flex:1;min-height:320px;position:relative}
.stage{position:relative;height:460px;background:radial-gradient(ellipse at 50% 30%,var(--surface-2),#D5DFE3);border-bottom:1px solid var(--line);touch-action:none;cursor:grab}
.stage canvas{display:block;width:100%;height:100%}
.stage-help{position:absolute;left:10px;bottom:8px;font-size:12px;color:#4f5f66;pointer-events:none}
.stage-reset{position:absolute;right:10px;bottom:8px}
.stage.panning{cursor:move}
.stage-tools{position:absolute;left:10px;top:10px;display:inline-flex;background:rgba(255,255,255,.92);border:1px solid #CFD9DD;border-radius:999px;padding:3px;z-index:2}
.stage-tools button{border:none;background:none;border-radius:999px;padding:6px 14px;font-size:14px;font-weight:500;color:#4f5f66;cursor:pointer}
.stage-tools button[aria-pressed="true"]{background:#E8792F;color:#fff}
.no3d{padding:20px;color:var(--muted);font-size:14px}
.ctl{display:flex;align-items:center;gap:12px;margin:12px 14px 0;border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;background:var(--surface-2)}
.ctl[hidden]{display:none}
.ctl .name{font-size:14px;font-weight:600}
.ctl .sub{font-size:12.5px;color:var(--muted)}
.ctl .meta{flex:1}
.ctl input[type=range]{width:100%;accent-color:var(--primary)}
.push{width:52px;height:52px;flex:none;border-radius:50%;border:4px solid #2F3D42;background:radial-gradient(circle at 40% 35%,#E5544E,#9E211C);cursor:pointer;touch-action:none;user-select:none;-webkit-user-select:none;box-shadow:0 4px 0 #11191C}
.push.down{transform:translateY(3px);box-shadow:0 1px 0 #11191C;filter:brightness(1.25)}
.info{margin-top:16px}
.inputs{margin:0 14px 10px}
.inputs label{display:block;font-size:14px;font-weight:500}
.inputs input[type=range]{width:100%;accent-color:var(--primary)}
.info{margin:0 14px 18px;display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.info h3{font-size:14px;margin:0 0 6px;font-weight:600}
.info ul,.info ol{margin:0;padding-left:20px;font-size:14px}
.info li{margin:3px 0}
.hint-press{font-size:13px;color:var(--muted);margin:0 14px 10px}
.msg{margin:0 16px 12px;padding:9px 12px;border-radius:10px;font-size:14px;background:#FDE8E6;color:#9B2620;display:none}
.msg.show{display:block}
.led-glow{transition:opacity .08s}
nav.tabs{display:none}
@media (max-width: 1000px){
  main{grid-template-columns:minmax(0,1fr)}
  .panel{display:none}
  .panel + .panel{border-left:none}
  .app[data-view="lessons"] #lessonPanel,.app[data-view="program"] #programPanel,.app[data-view="wiring"] #wiringPanel{display:flex}
  nav.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border-top:1px solid var(--line)}
  nav.tabs button{background:none;border:none;padding:10px 4px 12px;font-weight:500;color:var(--muted);font-size:14px;cursor:pointer}
  nav.tabs button[aria-current="true"]{color:var(--primary);font-weight:600}
  .brand h1{font-size:15px}
  header.top{padding:8px 12px}
}
@media print{ nav.tabs,header.top .btn-run,#lessonPanel{display:none} main{grid-template-columns:1fr 1fr} }
</style>
</head>
<body>
<div class="app" id="app" data-view="lessons">
  <header class="top">
    <div class="brand"><svg viewBox="0 0 32 32" aria-hidden="true"><rect x="2" y="5" width="28" height="22" rx="5" fill="#1E63A6"/><circle cx="11" cy="16" r="4.5" fill="none" stroke="#fff" stroke-width="2.2"/><circle cx="21" cy="16" r="4.5" fill="none" stroke="#fff" stroke-width="2.2"/><path d="M9 16h4M19 16h4M21 14v4" stroke="#fff" stroke-width="2"/></svg><h1>Arduino krok po kroku</h1></div>
    <div class="spacer"></div>
    <button class="btn btn-run" id="runBtn" type="button"><svg viewBox="0 0 14 14" aria-hidden="true"><path id="runIcon" d="M3 1.5v11l9-5.5z" fill="currentColor"/></svg><span id="runLabel">Uruchom</span></button>
  </header>
  <main>
    <section class="panel" id="lessonPanel" aria-label="Lekcje">
      <div class="panel-head"><h2>Lekcje</h2></div>
      <div class="scroll"><ul class="lessons" id="lessons"></ul></div>
    </section>
    <section class="panel" id="programPanel" aria-label="Program">
      <div class="panel-head"><h2>Program w blokach</h2></div>
      <div class="goal" id="goal"></div>
      <div id="blocklyDiv"></div>
      <div class="msg" id="msg" role="status"></div>
    </section>
    <section class="panel" id="wiringPanel" aria-label="Schemat podłączenia">
      <div class="panel-head"><h2>Schemat podłączenia</h2></div>
      <div class="scroll">
        <div class="stage" id="stage"><div class="stage-tools" role="group" aria-label="Sterowanie widokiem"><button type="button" id="modeRotate" aria-pressed="true">Obracaj</button><button type="button" id="modePan" aria-pressed="false">Przesuwaj</button></div><span class="stage-help">Kółko myszy: zbliżenie. Prawy przycisk myszy lub dwa palce: przesuwanie.</span><button class="btn stage-reset" id="resetView" type="button">Widok</button></div>
        <div class="ctl" id="pressBox" hidden><div class="push" id="pushBtn" role="button" tabindex="0" aria-label="Przycisk na pinie 2, przytrzymaj"></div><div class="meta"><div class="name">Przycisk</div><div class="sub">przytrzymaj, żeby wcisnąć</div></div></div>
        <div class="ctl" id="lightBox" hidden><div class="meta"><div class="name">Jasność w pokoju: <span id="lightVal">jasno</span></div><input type="range" id="lightRange" min="0" max="1023" value="800" aria-label="Jasność w pokoju"></div></div>
        <div class="info"><div><h3>Potrzebujesz</h3><ul id="partsList"></ul></div><div><h3>Podłącz po kolei</h3><ol id="stepsList"></ol></div></div>
      </div>
    </section>
  </main>
  <nav class="tabs" aria-label="Widok">
    <button type="button" data-view="lessons" aria-current="true">Lekcje</button>
    <button type="button" data-view="wiring">Schemat</button>
    <button type="button" data-view="program">Program</button>
  </nav>
</div>
<div id="modal" hidden><p id="modalMsg"></p><input id="modalInput"><button id="modalOk"></button><button id="modalCancel"></button></div>
<div hidden><input type="checkbox" id="soundOn" checked><pre id="serialOut"></pre><button id="clearSerial" type="button"></button></div>
<script>
"use strict";
const msgEl = document.getElementById("msg");
function showMsg(kind, text){ if(kind!=="err") return; msgEl.textContent = text; msgEl.classList.add("show"); }
function hideMsg(){ msgEl.classList.remove("show"); }
let current = null;
const TYPE = "(?:(?:unsigned|signed|const|static|volatile)\\s+)*(?:void|int|long|float|double|bool|boolean|byte|char|String|word|short|size_t|u?int(?:8|16|32)_t)(?:\\s+(?:int|long))?";
function translate(src){
  const lits = [];
  let s = src.replace(/\/\*[\s\S]*?\*\/|\/\/[^\n]*|"(?:\\.|[^"\\\n])*"|'(?:\\.|[^'\\\n])*'/g, m=>{
    if(m.startsWith("//")) return "";
    if(m.startsWith("/*")) return m.replace(/[^\n]/g," ");
    lits.push(m); return "__L"+(lits.length-1)+"__";
  });
  s = s.replace(/^[ \t]*#include[^\n]*/gm, "");
  s = s.replace(/^[ \t]*#define[ \t]+(\w+)[ \t]+([^\n]+)/gm, "const $1 = $2;");
  s = s.replace(/\bServo\s+(\w+)\s*;/g, "const $1 = __newServo();");
  // prototypy funkcji
  s = s.replace(new RegExp("^[ \\t]*"+TYPE+"\\s+\\w+\\s*\\([^)=]*\\)\\s*;","gm"), "");
  // definicje funkcji
  const names = [];
  s = s.replace(new RegExp("\\b"+TYPE+"\\s+(\\w+)\\s*\\(([^)]*)\\)\\s*\\{","g"), (m,name,params)=>{
    names.push(name);
    const ps = (!params.trim() || params.trim()==="void") ? "" :
      params.split(",").map(p=>p.trim().replace(/=.*$/,"").replace(/\[\s*\]/,"").trim().split(/\s+/).pop().replace(/[&*]/g,"")).join(", ");
    return "async function "+name+"("+ps+") {";
  });
  // tablice
  s = s.replace(new RegExp("\\b"+TYPE+"\\s+(\\w+)\\s*\\[\\s*\\w*\\s*\\]\\s*=\\s*\\{([^}]*)\\}","g"), "let $1 = [$2]");
  s = s.replace(new RegExp("\\b"+TYPE+"\\s+(\\w+)\\s*\\[\\s*(\\w+)\\s*\\]\\s*;","g"), "let $1 = new Array($2).fill(0);");
  // rzutowania
  s = s.replace(/\(\s*(?:unsigned\s+)?(?:int|long|byte|word|short)\s*\)\s*/g, "~~");
  s = s.replace(/\(\s*(?:float|double)\s*\)\s*/g, "");
  // deklaracje zmiennych
  s = s.replace(new RegExp("\\b"+TYPE+"\\s+(?=[A-Za-z_])","g"), "let ");
  s = s.replace(/\blet\s+([A-Za-z_]\w*(?:\s*,\s*[A-Za-z_]\w*)*)\s*;/g, (m,v)=>"let "+v.split(",").map(x=>x.trim()+" = 0").join(", ")+";");
  // wywołania funkcji użytkownika
  names.forEach(n=>{ s = s.replace(new RegExp("\\b"+n+"\\s*\\(","g"), "await "+n+"("); });
  s = s.replace(/async function await /g, "async function ");
  s = s.replace(/\bdelay\s*\(/g, "await delay(").replace(/\bdelayMicroseconds\s*\(/g, "await delayMicroseconds(");
  // pętle bez ciała i pętle w ogóle: dajemy oddech przeglądarce
  s = s.replace(/\bwhile\s*\(([^;{]*)\)\s*;/g, "while($1) { await __tick(); }");
  s = s.replace(/(\)|\belse|\bdo)\s*\{/g, "$1 { await __tick();");
  s = s.replace(/__L(\d+)__/g, (m,i)=>{ const l = lits[+i]; return l.startsWith("'") && l.length<=4 ? l : l; });
  return s;
}
const API_NAMES = ["__tick","__newServo","pinMode","digitalWrite","digitalRead","analogRead","analogWrite","delay","delayMicroseconds","millis","micros","tone","noTone","map","constrain","random","randomSeed","abs","min","max","pow","sqrt","sq","Serial","HIGH","LOW","INPUT","OUTPUT","INPUT_PULLUP","A0","A1","A2","A3","A4","A5","LED_BUILTIN","DEC"];
function compile(src){
  const js = translate(src);
  const AsyncFn = Object.getPrototypeOf(async function(){}).constructor;
  const body = "{\n"+js+"\nif (typeof setup !== 'function') throw new Error('Brakuje funkcji setup().');\nif (typeof loop !== 'function') throw new Error('Brakuje funkcji loop().');\nawait setup();\nwhile (true) { await loop(); await __tick(); }\n}";
  return new AsyncFn(...API_NAMES, body);
}
function plError(e){
  const m = String(e && e.message || e);
  let r;
  if((r = m.match(/^(\w+) is not defined/))) return `nie znam nazwy „${r[1]}”. Sprawdź pisownię (wielkość liter ma znaczenie) albo zadeklaruj zmienną.`;
  if((r = m.match(/^(?:\S+\.)?(\w+) is not a function/))) return `„${r[1]}” nie jest funkcją. Sprawdź pisownię.`;
  if((r = m.match(/Identifier '(\w+)' has already been declared/))) return `zmienna „${r[1]}” jest zadeklarowana dwa razy.`;
  if(/Unexpected token|Unexpected identifier|Invalid or unexpected|missing \)|Unexpected end/i.test(m)) return "coś w składni się nie zgadza (np. brakujący nawias, przecinek albo literówka). Porównaj z przykładem w lekcji.";
  return m;
}

/* ================= SYMULATOR PŁYTKI ================= */
const STOP = Symbol("stop");
const ui = { button:false, A0:700, A1:512 };
const sleep = ms => new Promise(r=>setTimeout(r,ms));
let audioCtx = null, osc = null, gainNode = null;
const board = {
  running:false, pins:{}, modes:{}, toggles:{}, servo:90, servoSet:new Set(), toneSet:new Set(), toneFreq:0, toneEnd:-1e9, toneTimer:null,
  serial:[], partial:"", numbers:[], n:0, t0:0, serialBegun:false, warned:false,
  reset(){ this.pins={}; this.modes={}; this.toggles={}; this.servo=90; this.servoSet=new Set(); this.toneSet=new Set(); this.toneFreq=0; this.toneEnd=-1e9;
    clearTimeout(this.toneTimer); this.serial=[]; this.partial=""; this.numbers=[]; this.n=0; this.t0=performance.now(); this.serialBegun=false; this.warned=false; stopSound(); renderSerial(); scheduleRender(); },
  setPin(p,v){ const was = (this.pins[p]||0)>0, now = v>0; if(was!==now) this.toggles[p]=(this.toggles[p]||0)+1; this.pins[p]=v; scheduleRender(); },
  lineOut(s){ this.serial.push(s); if(this.serial.length>400) this.serial.shift();
    const m = s.match(/-?\d+(?:\.\d+)?/); if(m && /^\s*-?\d+(\.\d+)?\s*$/.test(s)){ this.numbers.push(Number(m[0])); if(this.numbers.length>60) this.numbers.shift(); }
    renderSerial(); }
};
function check(){ if(!board.running) throw STOP; }
function pinNo(p){ p = Number(p); return p; }
function fmt(v){ if(typeof v === "number"){ return Number.isInteger(v) ? String(v) : v.toFixed(2); } if(typeof v === "boolean") return v ? "1" : "0"; return String(v); }
const api = {
  __tick: async ()=>{ check(); if(++board.n % 150 === 0) await sleep(0); check(); },
  __newServo: ()=>({ attach(){}, detach(){}, write(a){ a = Math.max(0, Math.min(180, Math.round(Number(a)||0))); board.servo=a; board.servoSet.add(a); scheduleRender(); }, read(){ return board.servo; } }),
  pinMode:(p,m)=>{ board.modes[pinNo(p)] = m; },
  digitalWrite:(p,v)=>{ board.setPin(pinNo(p), v ? 1 : 0); },
  digitalRead:(p)=>{ p = pinNo(p); if(p===2){ const pu = board.modes[2]===api.INPUT_PULLUP; return ui.button ? (pu?0:1) : (pu?1:0); } return (board.pins[p]||0)>0 ? 1 : 0; },
  analogRead:(p)=>{ p = pinNo(p); if(p<14) p += 14; return p===14 ? ui.A0 : p===15 ? ui.A1 : 0; },
  analogWrite:(p,v)=>{ v = Math.max(0, Math.min(255, Math.trunc(Number(v)||0))); board.setPin(pinNo(p), v/255); },
  delay: async (ms)=>{ ms = Math.max(0, Math.min(Number(ms)||0, 3600000)); const end = performance.now()+ms;
    do{ check(); const left = end-performance.now(); await sleep(Math.max(0, Math.min(25,left))); } while(performance.now() < end); check(); },
  delayMicroseconds: async (us)=>{ await api.delay((Number(us)||0)/1000); },
  millis:()=> Math.trunc(performance.now()-board.t0),
  micros:()=> Math.trunc((performance.now()-board.t0)*1000),
  tone:(p,f,d)=>{ f = Number(f)||0; if(f<=0) return; board.toneFreq=f; board.toneSet.add(Math.round(f)); startSound(f); clearTimeout(board.toneTimer);
    if(d){ board.toneEnd = performance.now()+Number(d); board.toneTimer = setTimeout(()=>api.noTone(p), Number(d)); } else board.toneEnd = Infinity; scheduleRender(); },
  noTone:()=>{ clearTimeout(board.toneTimer); if(board.toneFreq>0) board.toneEnd = performance.now(); board.toneFreq=0; stopSound(); scheduleRender(); },
  map:(x,a,b,c,d)=> Math.trunc((x-a)*(d-c)/(b-a)+c),
  constrain:(x,a,b)=> Math.min(Math.max(x,a),b),
  random:(a,b)=>{ if(b===undefined){ b=a; a=0; } return Math.floor(a + Math.random()*(b-a)); },
  randomSeed:()=>{}, abs:Math.abs, min:Math.min, max:Math.max, pow:Math.pow, sqrt:Math.sqrt, sq:x=>x*x,
  Serial:{ begin(){ board.serialBegun = true; }, end(){}, available(){ return 0; }, read(){ return -1; },
    print(v){ serialWarn(); board.partial += fmt(v); renderSerial(); },
    println(v){ serialWarn(); board.lineOut(board.partial + (v===undefined ? "" : fmt(v))); board.partial=""; } },
  HIGH:1, LOW:0, INPUT:0, OUTPUT:1, INPUT_PULLUP:2, A0:14, A1:15, A2:16, A3:17, A4:18, A5:19, LED_BUILTIN:13, DEC:10
};
function serialWarn(){ if(!board.serialBegun && !board.warned){ board.warned = true; showMsg("warn", "Wskazówka: na prawdziwej płytce dodaj Serial.begin(9600); w setup(), inaczej monitor nic nie pokaże."); } }
function startSound(f){
  if(!document.getElementById("soundOn").checked) return;
  try{
    if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
    if(audioCtx.state==="suspended") audioCtx.resume();
    if(!osc){ gainNode = audioCtx.createGain(); gainNode.gain.value = 0.04; gainNode.connect(audioCtx.destination);
      osc = audioCtx.createOscillator(); osc.type="square"; osc.connect(gainNode); osc.start(); }
    osc.frequency.setValueAtTime(f, audioCtx.currentTime);
  }catch(e){}
}
function stopSound(){ try{ if(osc){ osc.stop(); osc.disconnect(); } }catch(e){} osc = null; }
const serialOut = document.getElementById("serialOut");
let serialQueued = false;
function renderSerial(){ if(serialQueued) return; serialQueued = true; requestAnimationFrame(()=>{ serialQueued=false;
  serialOut.textContent = board.serial.join("\n") + (board.partial ? (board.serial.length?"\n":"")+board.partial : ""); serialOut.scrollTop = serialOut.scrollHeight; }); }
document.getElementById("clearSerial").onclick = ()=>{ board.serial=[]; board.partial=""; renderSerial(); };
/* ================= PŁYTKA 3D ================= */
const stage = document.getElementById("stage");
const scene3 = { ok:false };
let needRender = true;
function scheduleRender(){ needRender = true; if(typeof renderStates === 'function') renderStates(); }
(function init3D(){

  document.getElementById("resetView").onclick = ()=>{ view.rotY=0; view.rotX=0; view.px=0; view.pz=0; view.dist=view.dist0; applyView(); };

  };

  function frame(t){

    parts.button.cap.position.y = ui.button ? parts.button.y0-0.07 : parts.button.y0;
    parts.buzzer.ringMat.opacity = sounding ? 0.35+0.35*Math.sin(t/60) : 0;

    parts.pot.knob.rotation.y = -(ui.A1/1023*270-135)*Math.PI/180;
    parts.servo.arm.rotation.y = (servoShown-90)*Math.PI/180;
    renderer.render(scene, camera);
  }
  requestAnimationFrame(frame);
})();

  led:(on,pin)=>({type:"cd_led",fields:{ON:on?"1":"0",PIN:String(pin)}}),

/* bloki → program Arduino (C++) */
function cppName(n){ let s = String(n).normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/ł/g,"l").replace(/Ł/g,"L").replace(/[^A-Za-z0-9_]/g,"_"); if(!s || /^[0-9]/.test(s)) s = "v_"+s; return s; }
function generateCpp(){
  const root = ws.getBlocksByType("cd_program",false)[0];
  if(!root) return null;
  const ctx = {out:new Set(), inp:new Set(), servos:new Set(), loopN:0};
  const ind = n=>"  ".repeat(n);
  const val = (b,name,def="0")=>{ const t = b.getInputTargetBlock(name); return t ? expr(t) : def; };
  function expr(b){
    if(!b || !b.isEnabled()) return "0";
    switch(b.type){
      case "math_number": return String(b.getFieldValue("NUM"));
      case "text": return JSON.stringify(b.getFieldValue("TEXT"));
      case "cd_bool": return b.getFieldValue("V");
      case "cd_compare": return "("+val(b,"A")+" "+b.getFieldValue("OP")+" "+val(b,"B")+")";
      case "cd_logic": return "("+val(b,"A","false")+" "+b.getFieldValue("OP")+" "+val(b,"B","false")+")";
      case "cd_not": return "!("+val(b,"A","false")+")";
      case "cd_arith": return "("+val(b,"A")+" "+b.getFieldValue("OP")+" "+val(b,"B")+")";
      case "cd_mod": return "("+val(b,"A")+" % "+val(b,"B","1")+")";
      case "cd_random": return "random("+val(b,"A")+", "+val(b,"B")+" + 1)";
      case "cd_time": return b.getFieldValue("U")==="s" ? "(millis() / 1000)" : "millis()";
      case "cd_led_state": return "(digitalRead("+b.getFieldValue("PIN")+") == HIGH)";
      case "cd_pot": return "analogRead("+b.getFieldValue("PIN")+")";
      case "cd_button": ctx.inp.add(b.getFieldValue("PIN")); return "(digitalRead("+b.getFieldValue("PIN")+") == "+(b.getFieldValue("IS")==="1"?"HIGH":"LOW")+")";
      case "cd_light_val": return "analogRead("+b.getFieldValue("PIN")+")";
      case "cd_light_is": return "(analogRead("+b.getFieldValue("PIN")+") "+(b.getFieldValue("S")==="1"?">= 500":"< 500")+")";
      case "variables_get": return cppName(b.getField("VAR").getText());
      default: return "0";
    }
  }
  function stmts(b,n){ let o=""; for(; b; b=b.getNextBlock()){ if(b.isEnabled()) o += stmt(b,n); } return o; }
  function stmt(b,n){
    const p = ind(n);
    switch(b.type){
      case "cd_led": ctx.out.add(b.getFieldValue("PIN")); return p+"digitalWrite("+b.getFieldValue("PIN")+", "+(b.getFieldValue("ON")==="1"?"HIGH":"LOW")+");\n";
      case "cd_wait": { const t = val(b,"T"); const ms = b.getFieldValue("U")==="s" ? (/^[\d.]+$/.test(t) ? String(Math.round(parseFloat(t)*1000)) : t+" * 1000") : t; return p+"delay("+ms+");\n"; }
      case "cd_wait_until": return p+"while (!"+val(b,"COND","true")+") {\n"+p+"}\n";
      case "cd_if": return p+"if ("+val(b,"COND","false")+") {\n"+stmts(b.getInputTargetBlock("DO"),n+1)+p+"}\n";
      case "cd_ifelse": return p+"if ("+val(b,"COND","false")+") {\n"+stmts(b.getInputTargetBlock("DO"),n+1)+p+"} else {\n"+stmts(b.getInputTargetBlock("ELSE"),n+1)+p+"}\n";
      case "cd_repeat": { const c = "i"+(++ctx.loopN); return p+"for (int "+c+" = 0; "+c+" < "+val(b,"N")+"; "+c+"++) {\n"+stmts(b.getInputTargetBlock("DO"),n+1)+p+"}\n"; }
      case "cd_while": { const c = val(b,"COND","false"); return p+"while ("+(b.getFieldValue("M")==="until" ? "!"+c : c)+") {\n"+stmts(b.getInputTargetBlock("DO"),n+1)+p+"}\n"; }
      case "cd_note": { const d = b.getFieldValue("D"); return p+"tone(7, "+b.getFieldValue("N")+", "+d+");\n"+p+"delay("+d+");\n"; }
      case "cd_tone": { const d = val(b,"D"); return p+"tone(7, "+val(b,"F")+", "+d+");\n"+p+"delay("+d+");\n"; }
      case "cd_servo": { const pin = b.getFieldValue("PIN"); ctx.servos.add(pin); return p+"serwo"+pin+".write("+val(b,"A")+");\n"; }
      case "variables_set": return p+cppName(b.getField("VAR").getText())+" = "+val(b,"VALUE")+";\n";
      case "math_change": { const v = cppName(b.getField("VAR").getText()); return p+v+" = "+v+" + "+val(b,"DELTA")+";\n"; }
      default: return "";
    }
  }
  const setup = stmts(root.getInputTargetBlock("SETUP"),1), loop = stmts(root.getInputTargetBlock("LOOP"),1);
  let h = "";
  if(ctx.servos.size) h += "#include <Servo.h>\n" + [...ctx.servos].map(s=>"Servo serwo"+s+";").join("\n") + "\n";
  h += ws.getAllVariables().map(v=>"int "+cppName(v.name)+" = 0;").join("\n") + "\n";
  h += "void setup() {\n";
  [...ctx.out].forEach(pn=> h += "  pinMode("+pn+", OUTPUT);\n");
  [...ctx.inp].forEach(pn=> h += "  pinMode("+pn+", INPUT);\n");
  [...ctx.servos].forEach(s=> h += "  serwo"+s+".attach("+s+");\n");
  return h + setup + "}\nvoid loop() {\n" + loop + "}\n";
}

B.servoA = a => ({type:"cd_servo",fields:{PIN:"6"},inputs:{A:B.n(a)}});

const ws = Blockly.inject("blocklyDiv",{ readOnly:true, theme, renderer:"geras", sounds:false, trashcan:false,
  zoom:{controls:false, wheel:true, startScale:1.1, maxScale:2, minScale:0.4, pinch:true}, move:{scrollbars:true, drag:true, wheel:false},
  grid:{spacing:50, length:9, colour:"#C9C9C9", snap:false} });
function showProgram(){
  ws.clear(); Blockly.serialization.workspaces.load(current.sol(), ws);
  requestAnimationFrame(()=>{ Blockly.svgResize(ws); ws.setScale(1.1); ws.scrollCenter(); const m = ws.getMetrics();
    if(m && (m.contentWidth > m.viewWidth || m.contentHeight > m.viewHeight)) ws.zoomToFit(); ws.scrollCenter(); });
}
function renderLessons(){
  const ul = document.getElementById("lessons");
  ul.innerHTML = LESSONS.map((l,i)=>`<li><button type="button" data-id="${l.id}" aria-current="${l===current}"><span class="no">${i+1}</span>${l.title}</button></li>`).join("");
  ul.querySelectorAll("button").forEach(b=> b.onclick = ()=>{ openLesson(b.dataset.id); if(isMobile()) setView("wiring"); });
}
const push = document.getElementById("pushBtn");
const setBtn = v => { ui.button = v; push.classList.toggle("down", v); scheduleRender(); };
push.addEventListener("pointerdown", e=>{ e.preventDefault(); push.setPointerCapture?.(e.pointerId); setBtn(true); });
["pointerup","pointercancel","lostpointercapture"].forEach(ev=> push.addEventListener(ev, ()=>setBtn(false)));
push.addEventListener("keydown", e=>{ if(e.key===" "||e.key==="Enter"){ e.preventDefault(); setBtn(true); } });
push.addEventListener("keyup", e=>{ if(e.key===" "||e.key==="Enter") setBtn(false); });
push.addEventListener("contextmenu", e=>e.preventDefault());
const partIds = l => l.parts.map(p=> p.type==="led" ? "led"+p.pin : p.type==="ldr" ? "light" : p.type);
const lightRange = document.getElementById("lightRange");
lightRange.addEventListener("input", ()=>{ ui.A0 = +lightRange.value; document.getElementById("lightVal").textContent = ui.A0 < 500 ? "ciemno" : "jasno"; scheduleRender(); });
function openLesson(id){
  if(board.running){ runToken++; stopRun(); }
  current = LESSONS.find(l=>l.id===id) || LESSONS[0];
  try{ localStorage.setItem("cd4:current", current.id); }catch(e){}
  const i = LESSONS.indexOf(current);
  document.getElementById("goal").innerHTML = `<b>Lekcja ${i+1}: ${current.title}</b>${current.goal}`;
  document.getElementById("partsList").innerHTML = current.need.map(t=>`<li>${t}</li>`).join("");
  document.getElementById("stepsList").innerHTML = current.steps.map(t=>`<li>${t}</li>`).join("");
  document.getElementById("pressBox").hidden = !current.parts.some(p=>p.type==="button");
  document.getElementById("lightBox").hidden = !current.parts.some(p=>p.type==="ldr");
  board.reset(); hideMsg(); ui.button = false; ui.A0 = +lightRange.value;
  if(scene3.ok){ scene3.setVisible(partIds(current)); const sv = current.parts.some(p=>p.type==="servo"); scene3.focus(sv ? 1.6 : -2.1, sv ? 0.78 : 0.7); }
  renderLessons(); showProgram();
}

/* ================= URUCHAMIANIE ================= */
const runBtn = document.getElementById("runBtn");
let runToken = 0;
function setRunUi(r){ runBtn.classList.toggle("running", r); document.getElementById("runLabel").textContent = r ? "Zatrzymaj" : "Uruchom";
  document.getElementById("runIcon").setAttribute("d", r ? "M2.5 2.5h9v9h-9z" : "M3 1.5v11l9-5.5z"); }
async function run(){
  const src = generateCpp();
  let fn; try{ fn = compile(src); }catch(e){ showMsg("err","Coś poszło nie tak: "+plError(e)); return; }
  hideMsg();
  const token = ++runToken;
  board.reset(); board.running = true; setRunUi(true);
  if(audioCtx && audioCtx.state==="suspended") audioCtx.resume();
  if(isMobile()) setView("wiring");
  try{ await fn(...API_NAMES.map(n=>api[n])); }
  catch(e){ if(e!==STOP && token===runToken) showMsg("err","Program się zatrzymał: "+plError(e)); }
  finally{ if(token===runToken) stopRun(); }
}
function stopRun(){ board.running = false; api.noTone(); board.pins = {}; board.servo = 90; scheduleRender(); setRunUi(false); }
runBtn.onclick = ()=>{ if(board.running){ runToken++; stopRun(); } else run(); };

const isMobile = ()=> window.matchMedia("(max-width: 1000px)").matches;
function setView(v){ document.getElementById("app").dataset.view = v;
  document.querySelectorAll("nav.tabs button").forEach(b=> b.setAttribute("aria-current", b.dataset.view===v));
  if(v==="program") requestAnimationFrame(()=>{ Blockly.svgResize(ws); ws.scrollCenter(); }); }
document.querySelectorAll("nav.tabs button").forEach(b=> b.onclick = ()=> setView(b.dataset.view));
window.addEventListener("resize", ()=> Blockly.svgResize(ws));
let start = "l1"; try{ start = localStorage.getItem("cd4:current") || "l1"; }catch(e){}
openLesson(start);
</script>
